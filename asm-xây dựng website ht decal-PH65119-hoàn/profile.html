<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>
        Hồ sơ - HT Auto Decal
    </title>
<link href="css/style.css" rel="stylesheet"/>
</head>
<body>
<header class="header">
<div class="container header-container">
<a class="logo" href="index.html">
<span class="logo-ht">
                HT
            </span>
<div class="logo-text">
<h2>Auto Decal</h2>
<p>TEM XE • WRAP • PHỤ KIỆN</p>
</div>
</a>
<nav class="navbar">
<a href="index.html">
                Trang chủ
            </a>
<a href="products.html">
                Tem xe
            </a>
<a href="promotions.html">
                Khuyến mãi
            </a>
<a href="orders.html">
                Đơn hàng
            </a>
<a href="deals.html">
                Ưu đãi
            </a>
</nav>
<div class="header-actions">
<div class="user-area" id="userArea">
<a class="login-btn" href="login.html">
                    Đăng nhập
                </a>
<a class="register-btn" href="register.html">
                    Đăng ký
                </a>
</div>
</div>
</div>
</header>
<section class="ht-profile-page">
<div class="container ht-account-layout">
<aside class="ht-account-sidebar">
<div class="ht-account-user">
<div class="ht-account-avatar">
                    👤
                </div>
<div>
<small>
                        Xin chào,
                    </small>
<h3 id="accountName">
                        Người dùng
                    </h3>
</div>
</div>
<nav class="ht-account-menu">
<a href="orders.html">
                    🛍 Danh sách đơn hàng
                </a>
<a class="active" href="profile.html">
                    👤 Tài khoản
                </a>
<a class="active" href="profile.html">
                    📄 Hồ sơ
                </a>
</nav>
</aside>
<main class="ht-profile-content">
<div>
<h1>
                    Hồ sơ của tôi
                </h1>
<p>
                    Quản lý thông tin tài khoản của bạn.
                </p>
</div>
<form id="profileForm">
<div class="ht-profile-avatar">
                    👤
                </div>
<div class="ht-profile-group">
<label>
                        Họ và tên
                    </label>
<input id="profileName" required="" type="text"/>
</div>
<div class="ht-profile-group">
<label>
                        Email
                    </label>
<input id="profileEmail" required="" type="email"/>
</div>
<div class="ht-profile-group">
<label>
                        Số điện thoại
                    </label>
<input id="profilePhone" required="" type="tel"/>
</div>
<button class="ht-profile-save" type="submit">
                    LƯU THAY ĐỔI
                </button>
</form>
</main>
</div>
</section>
<script src="js/main.js"></script>
</body>
</html>
